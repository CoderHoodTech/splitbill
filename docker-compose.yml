# Local Postgres for SplitBill. The Laravel app itself is served by Laravel Herd
# (http://splitbill.test), not by Docker — this only provides the database.
#
# One-time setup:
#   docker compose up -d
#
# Then point .env at it (see .env.example for the DB_* values).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-splitbill}
      POSTGRES_USER: ${DB_USERNAME:-splitbill}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-splitbill} -d ${DB_DATABASE:-splitbill}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
